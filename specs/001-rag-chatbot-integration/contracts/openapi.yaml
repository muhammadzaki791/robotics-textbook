openapi: 3.0.3
info:
  title: RAG Chatbot API for Physical AI & Humanoid Robotics Textbook
  description: API for the RAG (Retrieval Augmented Generation) chatbot integrated with the Physical AI & Humanoid Robotics textbook. The API provides endpoints for chat interactions, content embedding, document management, and health monitoring.
  version: 1.0.0
  contact:
    name: API Support
    email: support@example.com

servers:
  - url: https://api.example.com/v1
    description: Production server

paths:
  /chat/ask:
    post:
      summary: Submit a question to the chatbot
      description: Submit a question to the chatbot and receive a response based on textbook content. Supports both normal mode and selected-text mode.
      operationId: askQuestion
      tags:
        - chat
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRequest'
      responses:
        '200':
          description: Successful response from the chatbot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatResponse'
        '404':
          description: No relevant content found in the textbook
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-codeSamples:
        - lang: curl
          source: |
            curl -X POST https://api.example.com/v1/chat/ask \
              -H "Authorization: Bearer YOUR_API_KEY" \
              -H "Content-Type: application/json" \
              -d '{
                "question": "Explain forward kinematics",
                "selected_text": null,
                "session_id": "session_123",
                "page_context": "/foundational-concepts/kinematics"
              }'

  /embed/chunk-and-store:
    post:
      summary: Process and store textbook content
      description: Process textbook content, create embeddings, and store in the vector database.
      operationId: chunkAndStore
      tags:
        - embedding
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmbedRequest'
      responses:
        '201':
          description: Content successfully processed and stored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmbedResponse'
        '400':
          description: Invalid input data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /embed/update:
    post:
      summary: Update existing embeddings
      description: Update existing embeddings for changed content.
      operationId: updateEmbeddings
      tags:
        - embedding
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRequest'
      responses:
        '200':
          description: Embeddings successfully updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateResponse'
        '400':
          description: Invalid input data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Document not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /documents/mapping:
    get:
      summary: Get document mapping
      description: Retrieve the mapping between document IDs and their metadata.
      operationId: getDocumentMapping
      tags:
        - documents
      security:
        - bearerAuth: []
      parameters:
        - name: chapter
          in: query
          description: Filter by chapter
          required: false
          schema:
            type: string
        - name: limit
          in: query
          description: Number of results to return (default: 50, max: 1000)
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 50
        - name: offset
          in: query
          description: Number of results to skip (default: 0)
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: Document mapping retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentMappingResponse'
        '400':
          description: Invalid query parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /documents/search:
    get:
      summary: Search documents
      description: Search for documents by content or metadata.
      operationId: searchDocuments
      tags:
        - documents
      security:
        - bearerAuth: []
      parameters:
        - name: q
          in: query
          description: Search query
          required: true
          schema:
            type: string
        - name: chapter
          in: query
          description: Limit search to specific chapter
          required: false
          schema:
            type: string
        - name: limit
          in: query
          description: Number of results to return (default: 10, max: 50)
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 10
      responses:
        '200':
          description: Search results retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentSearchResponse'
        '400':
          description: Invalid query parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /health:
    get:
      summary: Health check
      description: Check the health status of the API and its dependencies.
      operationId: healthCheck
      tags:
        - health
      responses:
        '200':
          description: Health status retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '500':
          description: Health check failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /stats:
    get:
      summary: Usage statistics
      description: Get usage statistics and performance metrics.
      operationId: getStats
      tags:
        - health
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Statistics retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatsResponse'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    ChatRequest:
      type: object
      required:
        - question
      properties:
        question:
          type: string
          description: The user's question
          example: "Explain the difference between forward and inverse kinematics"
        selected_text:
          type: string
          description: Text highlighted by user (if any)
          example: "Forward kinematics calculates the position of the end effector given joint angles"
        session_id:
          type: string
          description: Session identifier for conversation context
          example: "session_123"
        page_context:
          type: string
          description: Current page URL for context
          example: "/foundational-concepts/kinematics"

    ChatResponse:
      type: object
      required:
        - response_id
        - answer
        - sources
        - confidence_score
        - mode
        - timestamp
      properties:
        response_id:
          type: string
          description: Unique identifier for this response
          example: "resp_abc123"
        answer:
          type: string
          description: The chatbot's answer to the question
          example: "Forward kinematics calculates the position of the end effector given joint angles, while inverse kinematics calculates the required joint angles to achieve a desired end effector position."
        sources:
          type: array
          description: List of source documents referenced in the response
          items:
            $ref: '#/components/schemas/SourceDocument'
        confidence_score:
          type: number
          description: Confidence in the response (0.0-1.0)
          minimum: 0.0
          maximum: 1.0
          example: 0.95
        mode:
          type: string
          description: Either 'normal' or 'selected-text'
          enum: [normal, selected-text]
          example: "normal"
        timestamp:
          type: string
          description: ISO 8601 timestamp
          format: date-time
          example: "2025-12-10T15:30:00Z"

    SourceDocument:
      type: object
      required:
        - document_id
        - title
        - url
      properties:
        document_id:
          type: string
          description: ID of the source document
          example: "doc_kinematics_001"
        title:
          type: string
          description: Title of the source section
          example: "Kinematics Fundamentals"
        url:
          type: string
          description: URL to the source in the textbook
          example: "/foundational-concepts/kinematics"

    EmbedRequest:
      type: object
      required:
        - content
        - document_id
        - chapter_id
      properties:
        content:
          type: string
          description: The text content to be embedded
          example: "Forward kinematics is the process of calculating the position and orientation of the end effector given the joint angles of a robotic manipulator..."
        document_id:
          type: string
          description: Unique identifier for the document
          example: "kinematics-section-1"
        chapter_id:
          type: string
          description: Chapter identifier
          example: "foundational-concepts"
        section_title:
          type: string
          description: Title of the section
          example: "Forward Kinematics"
        metadata:
          type: object
          description: Additional metadata
          example: {"author": "textbook_author", "updated": "2025-12-01"}

    EmbedResponse:
      type: object
      required:
        - status
        - document_id
        - chunks_processed
        - embedding_time_ms
      properties:
        status:
          type: string
          description: Processing status
          example: "success"
        document_id:
          type: string
          description: The document identifier
          example: "kinematics-section-1"
        chunks_processed:
          type: integer
          description: Number of text chunks created
          example: 3
        embedding_time_ms:
          type: integer
          description: Time taken to generate embeddings
          example: 1250

    UpdateRequest:
      type: object
      required:
        - document_id
        - new_content
      properties:
        document_id:
          type: string
          description: Document to update
          example: "kinematics-section-1"
        new_content:
          type: string
          description: Updated content
          example: "Forward kinematics is the process of calculating the position and orientation of the end effector given the joint angles of a robotic manipulator. This is the inverse of inverse kinematics..."
        force_reindex:
          type: boolean
          description: Whether to force complete reindexing
          example: false

    UpdateResponse:
      type: object
      required:
        - status
        - document_id
        - chunks_updated
      properties:
        status:
          type: string
          description: Update status
          example: "success"
        document_id:
          type: string
          description: The updated document identifier
          example: "kinematics-section-1"
        chunks_updated:
          type: integer
          description: Number of chunks updated
          example: 3

    DocumentMappingResponse:
      type: object
      required:
        - documents
        - total_count
        - has_more
      properties:
        documents:
          type: array
          items:
            $ref: '#/components/schemas/DocumentMetadata'
        total_count:
          type: integer
          description: Total number of documents matching query
          example: 150
        has_more:
          type: boolean
          description: Whether more results are available
          example: true

    DocumentSearchResponse:
      type: object
      required:
        - results
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/SearchResult'

    DocumentMetadata:
      type: object
      required:
        - document_id
        - title
        - chapter
        - url_path
        - word_count
        - updated_at
      properties:
        document_id:
          type: string
          description: Unique document identifier
          example: "kinematics-section-1"
        title:
          type: string
          description: Document title
          example: "Forward Kinematics Explained"
        chapter:
          type: string
          description: Chapter name
          example: "Foundational Concepts"
        section:
          type: string
          description: Section within chapter
          example: "Kinematics"
        url_path:
          type: string
          description: URL path in textbook
          example: "/foundational-concepts/kinematics"
        word_count:
          type: integer
          description: Number of words in document
          example: 2500
        updated_at:
          type: string
          description: ISO 8601 timestamp
          format: date-time
          example: "2025-12-01T10:00:00Z"

    SearchResult:
      type: object
      required:
        - document_id
        - title
        - section
        - url_path
        - relevance_score
        - preview
      properties:
        document_id:
          type: string
          description: Unique document identifier
          example: "kinematics-section-1"
        title:
          type: string
          description: Document title
          example: "Forward Kinematics Explained"
        section:
          type: string
          description: Section within chapter
          example: "Kinematics"
        url_path:
          type: string
          description: URL path in textbook
          example: "/foundational-concepts/kinematics"
        relevance_score:
          type: number
          description: Relevance score (0.0-1.0)
          minimum: 0.0
          maximum: 1.0
          example: 0.85
        preview:
          type: string
          description: Brief preview of content
          example: "Forward kinematics is the process of calculating the position and orientation of the end effector given the joint angles of a robotic manipulator..."

    HealthResponse:
      type: object
      required:
        - status
        - timestamp
        - services
      properties:
        status:
          type: string
          description: Overall health status
          enum: [ok, degraded, unavailable]
          example: "ok"
        timestamp:
          type: string
          description: ISO 8601 timestamp
          format: date-time
          example: "2025-12-10T15:30:00Z"
        services:
          type: object
          required:
            - api
            - qdrant
            - postgres
          properties:
            api:
              type: object
              required:
                - status
                - version
              properties:
                status:
                  type: string
                  example: "ok"
                version:
                  type: string
                  example: "1.0.0"
            qdrant:
              type: object
              required:
                - status
                - available
              properties:
                status:
                  type: string
                  example: "ok"
                available:
                  type: boolean
                  example: true
            postgres:
              type: object
              required:
                - status
                - available
              properties:
                status:
                  type: string
                  example: "ok"
                available:
                  type: boolean
                  example: true

    StatsResponse:
      type: object
      required:
        - stats
        - timestamp
      properties:
        stats:
          type: object
          required:
            - total_queries
            - avg_response_time_ms
            - queries_per_minute
            - active_sessions
            - content_coverage
          properties:
            total_queries:
              type: integer
              description: Total number of queries processed
              example: 12500
            avg_response_time_ms:
              type: number
              description: Average response time in milliseconds
              example: 245.5
            queries_per_minute:
              type: number
              description: Recent queries per minute
              example: 15.2
            active_sessions:
              type: integer
              description: Currently active sessions
              example: 42
            content_coverage:
              type: number
              description: Percentage of textbook content indexed (0.0-1.0)
              minimum: 0.0
              maximum: 1.0
              example: 0.98
        timestamp:
          type: string
          description: ISO 8601 timestamp
          format: date-time
          example: "2025-12-10T15:30:00Z"

    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
              description: Error code
              example: "CONTENT_NOT_FOUND"
            message:
              type: string
              description: Human-readable error message
              example: "The answer is not found in the book."
            details:
              type: string
              description: Optional additional error details
              example: "No relevant content found in the textbook for the given question."

  parameters:
    PageLimit:
      name: limit
      in: query
      description: Number of results to return
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50